name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-rpm:
    runs-on: ubuntu-latest
    container: fedora:latest
    steps:
      - name: Install build dependencies
        run: |
          dnf install -y \
            git \
            go-rpm-macros \
            go-vendor-tools \
            golang \
            rpm-build \
            rpmdevtools

      - name: Checkout
        uses: actions/checkout@v4

      - name: Set version from tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Set up rpmbuild tree
        run: rpmdev-setuptree

      - name: Create source tarball
        run: |
          version="${{ steps.version.outputs.version }}"
          tar czf "${HOME}/rpmbuild/SOURCES/fetch-jwks-${version}.tar.gz" \
            --transform "s,^\./,fetch-jwks-${version}/," \
            --transform "s,^\.,fetch-jwks-${version}," \
            --exclude=.git \
            --exclude=.github \
            .

      - name: Generate vendor tarball
        run: |
          version="${{ steps.version.outputs.version }}"
          cp rpm/fetch-jwks.spec "${HOME}/rpmbuild/SPECS/"
          cp "${HOME}/rpmbuild/SOURCES/fetch-jwks-${version}.tar.gz" \
            "${HOME}/rpmbuild/SPECS/fetch-jwks-${version}.tar.gz"
          sed -i "s/^Version:.*/Version:        ${version}/" "${HOME}/rpmbuild/SPECS/fetch-jwks.spec"
          go_vendor_archive create "${HOME}/rpmbuild/SPECS/fetch-jwks.spec"
          cp "${HOME}/rpmbuild/SPECS/fetch-jwks-${version}-vendor.tar.gz" \
            "${HOME}/rpmbuild/SOURCES/"

      - name: Build RPM
        run: |
          version="${{ steps.version.outputs.version }}"
          rpmbuild -ba "${HOME}/rpmbuild/SPECS/fetch-jwks.spec" \
            --define "version ${version}"

      - name: Collect RPMs
        id: rpms
        run: |
          mkdir -p /tmp/rpms
          find "${HOME}/rpmbuild/RPMS" -name '*.rpm' -exec cp {} /tmp/rpms/ \;
          ls -la /tmp/rpms/

      - name: Upload RPM artifact
        uses: actions/upload-artifact@v4
        with:
          name: rpms
          path: /tmp/rpms/*.rpm

  release:
    needs: build-rpm
    runs-on: ubuntu-latest
    steps:
      - name: Download RPM artifacts
        uses: actions/download-artifact@v4
        with:
          name: rpms
          path: rpms

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: rpms/*.rpm
