# Configuration for go-vendor-tools
# See https://fedora.gitlab.io/sigs/go/go-vendor-tools/

[main]
# go-vendor-archive will write vendor license files to this directory
license-dir = "_licenses"

[licensing]
detector = "askalono"

[[licensing.licenses]]
path = "vendor/gopkg.in/yaml.v3/LICENSE"
sha256sum = "d18f6323b71b0b768bb5e9616e36da390fbd39369a81807cca352de4e4e6aa0b"
expression = "MIT AND Apache-2.0"
